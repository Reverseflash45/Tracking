# Rilis otomatis: push tag vX.Y.Z → tes, build APK bertanda tangan, rilis
# GitHub dengan dua APK (arm64 dan arm32).
#
# Cara pakai:
#   1. Naikkan `version:` di pubspec.yaml (mis. 1.3.0+4).
#   2. Tulis catatan rilis di rilis/vX.Y.Z.md (opsional; tanpa itu GitHub
#      menyusun daftar commit sendiri).
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY            — isi .env
#   ANDROID_KEYSTORE_BASE64                    — keystore rilis, base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
name: Rilis

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  rilis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versi pubspec harus sama dengan tag
        id: versi
        run: |
          versi=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$versi" != "$GITHUB_REF_NAME" ]; then
            echo "::error::pubspec.yaml berisi $versi, tapi tag-nya $GITHUB_REF_NAME. Samakan dulu."
            exit 1
          fi
          echo "versi=$versi" >> "$GITHUB_OUTPUT"

      - name: Semua secret harus ada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Gagal di sini lebih baik daripada diam-diam menandatangani dengan
        # debug key acak: APK seperti itu tidak bisa dipasang sebagai update.
        run: |
          for v in SUPABASE_URL SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 \
                   ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diatur."; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Tulis .env dan kunci tanda tangan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            "$RUNNER_TEMP/release.jks" > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Kumpulkan APK
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/tracking-$GITHUB_REF_NAME-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/tracking-$GITHUB_REF_NAME-arm32.apk"
          ls -l dist

      - name: Catatan rilis
        id: catatan
        run: |
          if [ -f "rilis/$GITHUB_REF_NAME.md" ]; then
            echo "path=rilis/$GITHUB_REF_NAME.md" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: Tracking ${{ steps.versi.outputs.versi }}
          body_path: ${{ steps.catatan.outputs.path }}
          generate_release_notes: ${{ steps.catatan.outputs.path == '' }}
          files: dist/*.apk

      - name: Bersihkan kunci
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties .env
